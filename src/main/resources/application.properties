spring.application.name=ps-orchestrator
server.port=${PORT:8085}

clients.ps-empresa.url=${PS_EMPRESA_URL:http://localhost:8081}
clients.ps-contrato.url=${PS_CONTRATO_URL:http://localhost:8082}
clients.ps-user.url=${PS_USER_URL:http://localhost:8083}
clients.ps-login.url=${PS_LOGIN_URL:http://localhost:8084}
security.internal-key=${INTERNAL_API_KEY:local-dev-key}
app.version=${APP_VERSION:${GIT_COMMIT:dev}}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read_only
